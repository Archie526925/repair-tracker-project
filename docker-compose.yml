services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: /app/data/repair_tracker.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    volumes:
      - dbdata:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-server

volumes:
  dbdata:
